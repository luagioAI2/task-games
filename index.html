<!doctype html><html><head>
<title>堆呀堆</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;}#app{position:fixed;inset:0}canvas{display:block}</style><script>
// 録画契约 C-C：mp:moment 唯一定义（type 仅取 "level-clear" / "new-best" / "achievement" / "boss-down" / "death"）。
// 游戏逻辑在过关/新高/run结束时经此派发。
self.__mpMoment = function (type, score) {
  try { self.dispatchEvent(new CustomEvent("mp:moment", { detail: { type: type, score: score } })); } catch (e) {}
};
</script>
<script type="importmap">
{
  "imports": {
    "pixi.js": "./engines/pixi.min.mjs",
    "@makeplay/fx": "./runtime/makeplay-fx/game.js",
    "@makeplay/sound": "./runtime/sound-1.js",
    "@makeplay/display": "./runtime/display-1.js"
  }
}
</script></head><body><div id="app" data-mp-stage data-mp-hud="canvas"></div><script type="module" src="./game.js"></script></body></html>
