<!doctype html><html><head>
<title>甜点魔法学院</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}#app{position:fixed;inset:0}canvas{display:block}</style><script type="importmap">
