<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>跳绳羊群</title>
<style>
  html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12}
  #app{position:fixed;inset:0}
  canvas{display:block}
</style>
<!-- Standalone harness only. The plugin build inlines every one of these through
     resolver aliases (scripts/build-plugin.mjs); a blob: module has no importmap,
     so the shipped bundle must never depend on this file. -->
<script type="importmap">
{
  "imports": {
    "pixi.js": "./engines/pixi.min.mjs",
    "@makeplay/fx": "./runtime/makeplay-fx/game.js",
    "@makeplay/sound": "./runtime/sound-1.js",
    "@makeplay/display": "./runtime/display-1.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  // Standalone harness: the plugin entry point is identical, minus the host-specific bits.
  import { start } from './game.js'
  start({ mountTo: document.getElementById('app'), assetBase: 'assets/' })
    .catch((e) => console.error('[ropeland] start failed', e))
</script>
</body>
</html>
