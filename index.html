     （见 src/main.js 的 start()），它才是样式的作用域根。
     这里只负责「整页没有边距、背景是游戏底色」。
-->

  <!-- 空 favicon：不给的话浏览器自动请求 /favicon.ico ⇒ 冒烟里一条假的 404 -->
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d12; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "@makeplay/sound": "./runtime/sound-1.js"
    }
  }
  </script>
</head>

  <script type="module" src="./game.js"></script>
</body>
</html>
