<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX 探针</title>
<style>
  html,body{margin:0;height:100%;background:#1b1b20;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:8px;top:8px;color:#9fe;font:12px/1.5 ui-monospace,monospace;
       background:#0008;padding:6px 10px;border-radius:6px;white-space:pre}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./engines/three.module.js",
    "@makeplay/fx": "./_originals/makeplay-fx/game.js"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from "three";

const params = new URLSearchParams(location.search);
const lib = params.get("lib") || "orig";          // orig | mine
const hud = document.getElementById("hud");

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x1b1b20, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 60);
camera.position.set(0, 0.15, 2.2);
camera.lookAt(0, 0.02, 0);

// 参照物：一根 0.6 宽的柱子 = 一只小熊的宽度（= referenceSpan），
// 再加地面网格，方便判断粒子大小/高度是否合理。
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(1, 2, 2); scene.add(dl);

const bear = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.3, 0.0, 4, 16),
  new THREE.MeshStandardMaterial({ color: 0x8a7a66, roughness: 0.9 })
);
bear.position.set(-0.85, 0.3, 0);
scene.add(bear);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 4),
  new THREE.MeshStandardMaterial({ color: 0x2a2a33, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
scene.add(floor);

const grid = new THREE.GridHelper(4, 16, 0x445, 0x334);
grid.position.y = -0.019;
scene.add(grid);

const viewport = () => ({ width: canvas.clientWidth || innerWidth, height: canvas.clientHeight || innerHeight });

let fx = null;
let impulse = { offsetX: 0, offsetY: 0, roll: 0, fovPunch: 0 };

(async () => {
  try {
    if (lib === "mine") {
      const mod = await import("./fx.js");
      fx = await mod.createThreeFx({
        THREE, renderer, world: scene, camera,
        viewport, referenceSpan: 0.6,
        onImpulse: (n) => { impulse = n; },
      });
    } else {
      const mod = await import("@makeplay/fx");
      fx = await mod.createThreeFx({
        THREE, renderer, world: scene, camera,
        viewport, referenceSpan: 0.6,
        onImpulse: (n) => { impulse = n; },
      });
    }
    hud.textContent = `lib=${lib}\nready`;
    window.__probeReady = true;
  } catch (e) {
    hud.textContent = `lib=${lib}\nERROR ${e && e.message}`;
    window.__probeError = String(e && (e.stack || e.message));
  }
})();

// 固定步进：headless 里真实时钟不可靠，必须由脚本驱动
function step(dt) {
  if (!fx) return { ok: false };
  const ts = fx.update(dt);
  const ix = impulse.offsetX * 0.02, iy = impulse.offsetY * 0.02;
  camera.position.x += ix; camera.position.y += iy;
  renderer.render(scene, camera);
  camera.position.x -= ix; camera.position.y -= iy;
  return { ok: true, timeScale: ts, impulse: { ...impulse } };
}

window.__probe = {
  play(name, power = 1) {
    if (!fx) return "no fx";
    fx.play(name, { pos: new THREE.Vector3(0, 0.35, 0), power });
    return "ok";
  },
  step,
  diag() { try { return fx && fx.diagnostics(); } catch (e) { return String(e); } },
  clear() { try { fx && fx.clear(); } catch (e) { /* ignore */ } },
};
</script>
</body>
</html>
